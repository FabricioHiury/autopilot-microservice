services:
  autopilot-micro:
    build: .
    ports:
      - '${PORT:-3005}:3005'
    env_file: .env
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/autopilot_micro
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      EVOLUTION_API_URL: http://evolution-api:8080
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3005}
      EVOLUTION_WEBHOOK_URL: http://autopilot-micro:3005/whatsapp/webhook/evolution
      AUTOPILOT_URL: ${AUTOPILOT_URL:-http://host.docker.internal:3003}
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3005/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped
  db-init:
    build:
      context: .
      target: builder
    command: ['pnpm', 'exec', 'prisma', 'db', 'push', '--skip-generate']
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/autopilot_micro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    ports:
      - '8080:8080'
    environment:
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Set EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/evolution
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      WEBHOOK_GLOBAL_ENABLED: 'false'
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: autopilot_micro
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d autopilot_micro']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
  evolution_instances:
